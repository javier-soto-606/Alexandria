<body id="frontdesk">
  <header>
	  <h1>Alexandria: Library of Knowledge</h1>
	  <ul>
		  <!-- Home page -->

  <main>
    <section class="library-panel login-panel">
      <h2>Sign in to Alexandria</h2>
      <p>Sign in with an account authorized by the library administrator.</p>
      <form id="login-form">
        <label>Email<input id="email" type="email" autocomplete="username" /></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" /></label>
        <button type="submit">Sign in</button>
      </form>
      <p id="message" class="library-message" role="status"></p>
    </section>
  </main>
  <footer><p> Este proyecto fue diseñada con la función de proyecto final</p></footer>
